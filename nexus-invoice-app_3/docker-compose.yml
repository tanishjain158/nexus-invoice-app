# Local or VPS deployment: `docker compose up -d --build`
# Copy .env.example to .env and set APP_USERNAME / APP_PASSWORD first — see README.
services:
  app:
    build: .
    ports:
      - "4000:4000"
    volumes:
      - ./data:/app/data
    environment:
      - APP_USERNAME=${APP_USERNAME:?set APP_USERNAME in .env}
      - APP_PASSWORD=${APP_PASSWORD:?set APP_PASSWORD in .env}
      - PORT=4000
    restart: unless-stopped
